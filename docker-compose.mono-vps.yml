x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    container_name: autocommerce_postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: ${TZ:-Africa/Tunis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 1m
    logging: *default-logging
    # L’entrypoint officiel initialise le volume puis passe sous postgres.
    # PostgreSQL reste non publié et isolé sur le réseau Docker privé.
    mem_limit: 1g
    cpus: "1.00"
    pids_limit: 200
    networks:
      - clinic_net

  redis:
    image: redis:7-alpine
    container_name: autocommerce_redis
    restart: unless-stopped
    init: true
    command: ["sh", "-c", "exec redis-server --appendonly yes --protected-mode yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      TZ: ${TZ:-Africa/Tunis}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    stop_grace_period: 30s
    logging: *default-logging
    # L’entrypoint Redis initialise appendonlydir puis s’exécute sous redis.
    # Redis reste non publié et isolé sur le réseau Docker privé.
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 100
    networks:
      - clinic_net

  api:
    build:
      context: ./api-server
    container_name: autocommerce_api
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Africa/Tunis}
      ENV: ${ENV:-production}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-enterprise}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      FERNET_KEY: ${FERNET_KEY:?FERNET_KEY must be set}
      PHOTO_ENCRYPTION_KEY: ${PHOTO_ENCRYPTION_KEY:?PHOTO_ENCRYPTION_KEY must be set}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      MEDICAL_AI_PROVIDER_APPROVED: ${MEDICAL_AI_PROVIDER_APPROVED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_PROVIDER_ALLOWLIST: ${LLM_PROVIDER_ALLOWLIST:-openai}
      LLM_MODEL_ALLOWLIST: ${LLM_MODEL_ALLOWLIST:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      PUBLIC_ROUTES_ENABLED: ${PUBLIC_ROUTES_ENABLED:-true}
      PUBLIC_CLINIC_ID: ${PUBLIC_CLINIC_ID:?PUBLIC_CLINIC_ID must be set}
      WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-true}
      SOCIAL_WEBHOOK_CLINIC_ID: ${SOCIAL_WEBHOOK_CLINIC_ID:?SOCIAL_WEBHOOK_CLINIC_ID must be set}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=127.0.0.1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - clinic_data:/app/data
      - clinic_backups:/app/backups
    # L’API est uniquement joignable par le reverse-proxy hôte.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 1m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 768m
    cpus: "1.00"
    pids_limit: 200
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    networks:
      - clinic_net

  worker:
    build:
      context: ./api-server
    container_name: autocommerce_worker
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Africa/Tunis}
      ENV: ${ENV:-production}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-enterprise}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      FERNET_KEY: ${FERNET_KEY:?FERNET_KEY must be set}
      PHOTO_ENCRYPTION_KEY: ${PHOTO_ENCRYPTION_KEY:?PHOTO_ENCRYPTION_KEY must be set}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      MEDICAL_AI_PROVIDER_APPROVED: ${MEDICAL_AI_PROVIDER_APPROVED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_PROVIDER_ALLOWLIST: ${LLM_PROVIDER_ALLOWLIST:-openai}
      LLM_MODEL_ALLOWLIST: ${LLM_MODEL_ALLOWLIST:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      PUBLIC_ROUTES_ENABLED: ${PUBLIC_ROUTES_ENABLED:-true}
      PUBLIC_CLINIC_ID: ${PUBLIC_CLINIC_ID:?PUBLIC_CLINIC_ID must be set}
      WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-true}
      SOCIAL_WEBHOOK_CLINIC_ID: ${SOCIAL_WEBHOOK_CLINIC_ID:?SOCIAL_WEBHOOK_CLINIC_ID must be set}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
    command:
      - celery
      - -A
      - services.celery_app.celery
      - worker
      - --loglevel=INFO
      - --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
      - --max-tasks-per-child=100
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - clinic_data:/app/data
      - clinic_backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "celery -A services.celery_app.celery inspect ping --timeout=3 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 1m
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    cpus: "1.00"
    pids_limit: 300
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    networks:
      - clinic_net

  beat:
    build:
      context: ./api-server
    container_name: autocommerce_beat
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Africa/Tunis}
      ENV: ${ENV:-production}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-enterprise}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      FERNET_KEY: ${FERNET_KEY:?FERNET_KEY must be set}
      PHOTO_ENCRYPTION_KEY: ${PHOTO_ENCRYPTION_KEY:?PHOTO_ENCRYPTION_KEY must be set}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      MEDICAL_AI_PROVIDER_APPROVED: ${MEDICAL_AI_PROVIDER_APPROVED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_PROVIDER_ALLOWLIST: ${LLM_PROVIDER_ALLOWLIST:-openai}
      LLM_MODEL_ALLOWLIST: ${LLM_MODEL_ALLOWLIST:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      PUBLIC_ROUTES_ENABLED: ${PUBLIC_ROUTES_ENABLED:-true}
      PUBLIC_CLINIC_ID: ${PUBLIC_CLINIC_ID:?PUBLIC_CLINIC_ID must be set}
      WEBHOOKS_ENABLED: ${WEBHOOKS_ENABLED:-true}
      SOCIAL_WEBHOOK_CLINIC_ID: ${SOCIAL_WEBHOOK_CLINIC_ID:?SOCIAL_WEBHOOK_CLINIC_ID must be set}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
    command: ["celery", "-A", "services.celery_app.celery", "beat", "--loglevel=INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - clinic_data:/app/data
      - clinic_backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "celery -A services.celery_app.celery inspect ping --timeout=3 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 100
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    networks:
      - clinic_net

  web:
    build:
      context: ./autocommerce-app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-/api/v1}
        VITE_PUBLIC_API_URL: ${PUBLIC_PUBLIC_API_URL:-/api/public}
    container_name: autocommerce_web
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    # Le Nginx hôte écoute 80/443 ; le frontend est donc publié uniquement en local sur 8080.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8080/index.html || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID, NET_BIND_SERVICE]
    read_only: true
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 100
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid,uid=100,gid=102,mode=0755
      - /var/run:size=8m,noexec,nosuid,uid=100,gid=102,mode=0755
      - /tmp:size=16m,noexec,nosuid,uid=100,gid=102,mode=0755
    networks:
      - clinic_net

networks:
  clinic_net:
    driver: bridge
    internal: false

volumes:
  postgres_data:
  redis_data:
  clinic_data:
  clinic_backups:
