pid /tmp/autoclinique-nginx.pid;
error_log /tmp/autoclinique-nginx-error.log;
events { worker_connections 1024; }
http {
  access_log /tmp/autoclinique-nginx-access.log;
  client_body_temp_path /tmp/autoclinique-nginx-body;
  proxy_temp_path /tmp/autoclinique-nginx-proxy;
  fastcgi_temp_path /tmp/autoclinique-nginx-fastcgi;
  uwsgi_temp_path /tmp/autoclinique-nginx-uwsgi;
  scgi_temp_path /tmp/autoclinique-nginx-scgi;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server {
    listen 8080;
    server_name _;
    root /home/ubuntu/work_autoclinique_pass4/autocommerce-app/dist/public;
    add_header X-Content-Type-Options nosniff always;
    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
