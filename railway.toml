[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash /app/start-railway.sh"
healthcheckPath = "/health"
# Les migrations Alembic s’exécutent avant Uvicorn au premier démarrage.
# 300 s évite un échec réseau prématuré sur Railway.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
