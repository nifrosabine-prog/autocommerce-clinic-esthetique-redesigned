name: Extract project archive



on:

  push:
  
    paths:
    
      - "*.zip"
      
      - ".github/workflows/extract-project.yml"
      
  workflow_dispatch:
  


permissions:

  contents: write
  


jobs:

  extract-project:
  
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout repository
      
        uses: actions/checkout@v4
        
        with:
        
          fetch-depth: 0
          


      - name: Extract latest project archive
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          archive="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          
          test -n "$archive"
          
          rm -rf .project-extract
          
          mkdir .project-extract
          
          unzip -q -o "$archive" -d .project-extract
          
          root=".project-extract"
          
          mapfile -t dirs < <(find .project-extract -mindepth 1 -maxdepth 1 -type d)
          
          mapfile -t files < <(find .project-extract -mindepth 1 -maxdepth 1 -type f)
          
          if [ "${#dirs[@]}" -eq 1 ] && [ "${#files[@]}" -eq 0 ]; then
          
            root="${dirs[0]}"
            
          fi
          
          test -d "$root/api-server"
          
          test -d "$root/autocommerce-app"
          
          cp -a "$root"/. .
          
          rm -rf .project-extract
          


      - name: Commit extracted project
      
        shell: bash
        
        run: |
        
          set -euo pipefail
          
          git config user.name "github-actions[bot]"
          
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --cached --quiet; then
          
            echo "No extracted changes to commit"
            
          else
          
            git commit -m "Extract AutoCommerce Clinic project sources"
            
            git push
            
          fi
          


      - name: Verify project layout
      
        run: |
        
          test -f api-server/requirements.txt
          
          test -f autocommerce-app/package.json
          
          echo "Project sources extracted successfully for Railway"
















































