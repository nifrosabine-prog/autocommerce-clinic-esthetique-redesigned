[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash -lc 'exec uvicorn main:app --app-dir /app/api-server --host 0.0.0.0 --port \"${PORT:-8080}\"'"
preDeployCommand = ["bash -lc 'cd /app/api-server && alembic upgrade head'"]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
